aid: influxdata
name: InfluxData
description: InfluxData is the company behind InfluxDB, the leading open source time series database purpose-built
  for real-time analytics, monitoring, IoT and sensor data, application metrics, and observability workloads.
  InfluxDB ingests millions of data points per second and ships as open source (InfluxDB OSS), a fully
  managed multi-cloud service (InfluxDB Cloud), and dedicated/clustered offerings. The platform exposes
  a REST /api/v2 HTTP API for writing line-protocol data, querying with Flux and InfluxQL/SQL, and managing
  buckets, organizations, tasks, API tokens, and dashboards, alongside official client libraries, the
  influx CLI, and the Telegraf collection agent.
