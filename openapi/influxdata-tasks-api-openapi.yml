      tags:
      - Tasks
      summary: Remove an owner from a task
      description: '**Deprecated**: Tasks don''t use `owner` and `member` roles.

        Use [`/api/v2/authorizations`](#tag/Authorizations-(API-tokens)) to assign user permissions.

